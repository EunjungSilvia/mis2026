<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS Learning Hub · 2026</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#1f2328;background:#f6f6f4}
*{box-sizing:border-box}body{margin:0}
.shell{max-width:980px;margin:48px auto;padding:0 20px}
.panel{background:#fff;border:1px solid #e3e3df;border-radius:18px;padding:26px 28px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:1.45rem;margin:0}.pill{background:#f1f1ee;border-radius:999px;padding:5px 11px;font-size:.82rem;color:#3d4247}
.sub{color:#6b6f73;font-size:.95rem;margin:-12px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a.card{display:block;text-decoration:none;color:inherit;border:1px solid #e3e3df;border-radius:14px;padding:22px 22px 24px;transition:border-color .15s,box-shadow .15s}
a.card:hover{border-color:#b9bdbf;box-shadow:0 6px 18px rgba(0,0,0,.05)}
a.card svg{width:22px;height:22px;color:#2b3036}
a.card h2{font-size:1.25rem;margin:14px 0 8px}a.card p{margin:0;color:#6b6f73;font-size:.93rem;line-height:1.55}
a.card .go{margin-top:16px;font-size:.88rem;font-weight:700;color:#245943}
@media(max-width:640px){.grid{grid-template-columns:1fr}.shell{margin:20px auto}}
</style></head><body>
<div class="shell"><div class="panel">
  <div class="top"><h1>MIS Learning Hub</h1><span class="pill">경영정보시스템 · 2026</span></div>
  <p class="sub">들어갈 공간을 고르세요.</p>
  <div class="grid">
    <a class="card" href="materials/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4.5 8 4.5 12 6.5c4-2 7.5-2 10-1v13c-2.5-1-6-1-10 1-4-2-7.5-2-10-1z"/><path d="M12 6.5v13"/></svg>
      <h2>강의자료</h2>
      <p>주차별 Learning Guide와 수업자료를 확인합니다.</p>
      <div class="go">자료 보기 →</div>
    </a>
    <a class="card" href="journal/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <h2>My AX Workspace</h2>
      <p>로그인 후 내 학습기록(10~12주차 저널)과 워크숍 공간으로 들어갑니다.</p>
      <div class="go">내 공간 열기 →</div>
    </a>
  </div>
</div></div>
</body></html>
