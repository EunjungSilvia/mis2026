<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS 2026 · 러닝 저널 조회 (교수자)</title>
<style>
:root{--bg:#f3f0ea;--paper:#fffdf9;--ink:#18211d;--muted:#69716c;--line:#d9d2c7;--green:#244f43;--accent:#b44d35;--soft:#f5f2ed}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1240px;margin:auto;padding:0 20px}
header{background:linear-gradient(135deg,#17211d,#294238);color:#fff;border-top:6px solid var(--accent);padding:26px 0}
.eyebrow{font-size:.76rem;letter-spacing:.14em;color:#e5b29e;font-weight:800}h1{margin:6px 0 4px;font-size:clamp(1.6rem,3.5vw,2.3rem)}.sub{color:#d8dfdb;font-size:.9rem}
main{padding:22px 0 60px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(29,36,32,.05);margin-bottom:14px}
.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;font-size:15px}input,select{border:1px solid #cfc8bd;background:#fff;border-radius:10px;padding:10px 12px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#ece7df;color:#28352f}
.seg{display:inline-flex;border:1px solid #cfc8bd;border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:10px 13px;cursor:pointer;font-weight:750;color:#3b4a43}.seg button.on{background:var(--green);color:#fff}
.note{font-size:.86rem;color:var(--muted);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:var(--soft);border-radius:12px;padding:12px 14px}.stat .n{font-size:1.5rem;font-weight:850}.stat .l{font-size:.78rem;color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:14px;max-height:70vh}
table{border-collapse:collapse;width:100%;min-width:860px;background:#fff}th,td{border-bottom:1px solid #ece6dd;padding:9px;text-align:center;font-size:.88rem}
th{position:sticky;top:0;background:#f4f0e9;font-weight:850;z-index:1}td.l,th.l{text-align:left}tr.click{cursor:pointer}tr.click:hover{background:#fbf8f2}
.ok{display:inline-block;min-width:44px;border-radius:999px;background:#e3efe7;color:var(--green);font-weight:850;padding:3px 8px;font-size:.8rem}.no{color:#bbb}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:14px}
.jc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.jc h3{margin:0 0 3px;font-size:1.02rem}.jc .meta{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.qa{margin:9px 0 0}.qa .q{font-size:.76rem;color:var(--muted);font-weight:750}.qa .a{white-space:pre-wrap;line-height:1.55;font-size:.92rem}
.pill{display:inline-block;background:#eee8df;border-radius:999px;padding:4px 9px;margin:2px 5px 2px 0;font-size:.8rem}
.detail h2{margin:0 0 6px}.wk{border-top:1px solid #ece6dd;padding-top:12px;margin-top:12px}.wk h3{margin:0 0 4px}
.sec{font-weight:800;margin-top:12px;color:#2c4a3d}
.paper{max-width:860px;margin:22px 0 8px;padding-top:18px;border-top:1px solid #ece6dd}.kicker{color:#2563b8;font-weight:800;font-size:.88rem;margin-bottom:4px}.ptitle{font-size:1.6rem;font-weight:850;margin:0 0 10px}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;background:#f7f6f2;border:1px solid #e3e1da;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.sh{font-size:1rem;margin:18px 0 6px}
table.sheet{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed;margin-bottom:4px;background:#fff}
.sheet th,.sheet td{border:1px solid #9a9ea6;vertical-align:middle;padding:0;text-align:left;font-size:.9rem;position:static}
.sheet th{background:#efeee9;font-weight:700;padding:8px 10px;line-height:1.45}
.sheet.kv th{width:33%}.sheet.grid thead th:first-child,.sheet .rl{width:23%}
.pval{white-space:pre-wrap;word-break:break-word;padding:8px 10px;line-height:1.55;min-height:36px}.pval.tall{min-height:80px}
.starbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.starbtn{border:1px solid #e0c36a;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;color:#8a6a00}.starbtn.on{background:#fff4cc}
.starmemo{flex:1;min-width:220px;border:1px solid #cfc8bd;border-radius:8px;padding:7px 10px;font-size:.9rem}.memosaved{font-size:.78rem;color:#2f9e63}.star{color:#d99a00;font-weight:900}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap"><div class="eyebrow">MIS 2026 · INSTRUCTOR</div><h1>러닝 저널 조회</h1><div class="sub">10~12주차 AI 미니 미션 저널 · 학생 본인과 교수자만 볼 수 있습니다.</div></div></header>
<main class="wrap">
<section id="loginCard" class="card hidden">
  <h2 style="margin-top:0">교수자 로그인</h2>
  <p class="note">관리자 이메일로 로그인 링크를 받습니다. 참여 현황 관리자 화면에서 이미 로그인했다면 바로 열립니다.</p>
  <div class="row"><input id="email" type="email" placeholder="ejhan@sookmyung.ac.kr" style="min-width:280px"><button class="btn" id="loginBtn">로그인 링크 받기</button></div>
  <p class="note" id="loginStatus"></p>
</section>

<section id="app" class="hidden">
  <div class="card">
    <div class="row">
      <select id="section"><option value="">전체 분반</option></select>
      <div class="seg" id="weekSeg"></div>
      <input id="search" placeholder="이름·학번·닉네임·내용 검색" style="flex:1;min-width:200px">
      <label class="note"><input type="checkbox" id="onlyDone"> 작성한 학생만</label>
      <label class="note"><input type="checkbox" id="onlyStar"> ★ 별표만</label>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="seg" id="viewSeg"><button data-v="table" class="on">목록</button><button data-v="cards">내용 펼쳐 보기</button></div>
      <button class="btn secondary" id="refresh">새로고침</button><button class="btn" id="csv">전체 내려받기 (CSV)</button>
      <label class="note"><input type="checkbox" id="auto"> 30초마다 자동 새로고침</label>
      <span class="note" id="status" style="margin-left:auto"></span>
      <button class="btn secondary" id="logout">로그아웃</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">-</div><div class="l">학생 수</div></div>
      <div class="stat"><div class="n" id="sDone">-</div><div class="l">선택 주차 작성</div></div>
      <div class="stat"><div class="n" id="sRate">-</div><div class="l">작성률</div></div>
      <div class="stat"><div class="n" id="sLast">-</div><div class="l">마지막 저장</div></div>
    </div>
  </div>
  <div id="tableView" class="tablewrap"><table><thead><tr><th class="l">이름 · 학번</th><th>분반</th><th class="l">닉네임</th><th class="l">관심 대상</th><th>10주차</th><th>11주차</th><th>12주차</th><th>마지막 저장</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="cardView" class="cards hidden"></div>
  <div id="detail" class="card detail hidden" style="margin-top:14px"></div>
</section>
</main>
<script src="../journal/weeks.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://bwmbjfrrbeepfdfboqbg.supabase.co','sb_publishable_Ag59Uqz-yvH4AqznKHMg1g__p3sEvL0');
const WEEKS=window.JOURNAL_WEEKS;const $=id=>document.getElementById(id);
let roster=[],nickByStudent=new Map(),journals=new Map(),week=10,view='table',autoTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().toLowerCase();
const fmt=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const filled=r=>r&&Object.values(r.responses||{}).some(v=>String(v||'').trim());
const fieldsOf=w=>(WEEKS.find(x=>x.week===w)?.sections||[]).flatMap(s=>s.fields||[]);

$('weekSeg').innerHTML=WEEKS.map(w=>'<button data-w="'+w.week+'"'+(w.week===week?' class="on"':'')+'>'+w.week+'주차</button>').join('');
$('weekSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;week=Number(b.dataset.w);[...$('weekSeg').children].forEach(x=>x.classList.toggle('on',x===b));render()};
$('viewSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('viewSeg').children].forEach(x=>x.classList.toggle('on',x===b));render()};
['section','search','onlyDone','onlyStar'].forEach(id=>$(id).addEventListener('input',render));
$('refresh').onclick=load;
$('auto').onchange=()=>{clearInterval(autoTimer);if($('auto').checked)autoTimer=setInterval(load,30000)};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('loginBtn').onclick=async()=>{const e=$('email').value.trim();if(!e)return;$('loginBtn').disabled=true;const{error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});$('loginBtn').disabled=false;$('loginStatus').textContent=error?'링크를 보내지 못했습니다: '+error.message:'이메일의 로그인 링크를 누르면 이 화면으로 돌아옵니다.'};

let pinGrants=new Map();
async function loadGrants(){const {data,error}=await db.from('pin_reset_grants').select('student_id,granted_at,expires_at,used_at');pinGrants=new Map((error?[]:data||[]).map(g=>[String(g.student_id),g]));}
function grantState(sid){const g=pinGrants.get(String(sid));if(!g)return null;const f=t=>new Date(t).toLocaleString('ko-KR');if(g.used_at)return {k:'used',t:'PIN 재설정 완료 · 학생이 '+f(g.used_at)+'에 새 PIN으로 바꿨어요.'};if(new Date(g.expires_at)<new Date())return {k:'expired',t:'PIN 재설정 허용이 만료됐어요('+f(g.expires_at)+'). 필요하면 다시 허용해 주세요.'};return {k:'pending',t:'재설정 허용됨 · '+f(g.expires_at)+'까지 · 학생이 아직 새 PIN을 정하지 않았어요.'};}
function pinBadge(sid){const st=grantState(sid);return st&&st.k==='pending'?' <span style="display:inline-block;border-radius:999px;background:#fdf0dc;color:#8a5a00;font-weight:800;padding:2px 8px;font-size:.75rem">PIN 재설정 대기</span>':'';}
let stars=new Map();
async function loadStars(){const {data,error}=await db.from('journal_stars').select('student_id,week_number,starred,memo,updated_at');stars=new Map((error?[]:data||[]).map(x=>[x.student_id+':'+x.week_number,x]));}
const isStar=(sid,w)=>!!stars.get(sid+':'+w)?.starred;
async function saveStar(sid,w,patch){const cur=stars.get(sid+':'+w)||{student_id:sid,week_number:w,starred:false,memo:''};const row={student_id:sid,week_number:w,starred:patch.starred??cur.starred,memo:patch.memo??cur.memo,updated_at:new Date().toISOString()};const {error}=await db.from('journal_stars').upsert(row);if(error){$('status').textContent='별표를 저장하지 못했습니다: '+error.message;return false}stars.set(sid+':'+w,row);return true;}
document.addEventListener('click',async e=>{const b=e.target.closest('.starbtn');if(!b)return;const sid=Number(b.dataset.sid),w=Number(b.dataset.w);b.disabled=true;const ok=await saveStar(sid,w,{starred:!isStar(sid,w)});b.disabled=false;if(ok){const on=isStar(sid,w);b.textContent=on?'★ 별표됨':'☆ 별표';b.classList.toggle('on',on);render();}});
document.addEventListener('change',async e=>{const m=e.target.closest('.starmemo');if(!m)return;const sid=Number(m.dataset.sid),w=Number(m.dataset.w);const ok=await saveStar(sid,w,{memo:m.value.trim()});const t=m.parentElement.querySelector('.memosaved');if(t)t.textContent=ok?'메모 저장됨':'';});
async function auth(){const{data:{session}}=await db.auth.getSession();$('loginCard').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session)await load()}
async function load(){
  $('status').textContent='불러오는 중…';
  const [r1,r2,r3]=await Promise.all([
    db.from('student_roster').select('id,student_number,full_name,major,section_code').order('section_code').order('full_name'),
    db.from('site_nickname_registry').select('nickname,student_id'),
    db.from('student_journals').select('student_id,week_number,responses,updated_at,full_name,student_number,section_code')
  ]);
  if(r1.error||r3.error){$('status').textContent='권한이 없거나 불러오지 못했습니다. 관리자 이메일로 로그인했는지 확인해 주세요.';return}
  roster=r1.data||[];nickByStudent=new Map((r2.data||[]).filter(x=>x.student_id!=null).map(x=>[x.student_id,x.nickname]));
  journals=new Map();(r3.data||[]).forEach(j=>journals.set(j.student_id+':'+j.week_number,j));
  await loadGrants();await loadStars();
  const secs=[...new Set(roster.map(s=>s.section_code).filter(Boolean))].sort();
  const cur=$('section').value;$('section').innerHTML='<option value="">전체 분반</option>'+secs.map(s=>'<option'+(s===cur?' selected':'')+'>'+esc(s)+'</option>').join('');
  $('status').textContent='갱신 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  render();
}
function rows(){
  const sec=$('section').value,q=norm($('search').value),only=$('onlyDone').checked,onlyS=$('onlyStar').checked;
  return roster.filter(s=>{
    if(sec&&s.section_code!==sec)return false;
    const j=journals.get(s.id+':'+week);
    if(only&&!filled(j))return false;
    if(onlyS&&!isStar(s.id,week))return false;
    if(!q)return true;
    const hay=[s.full_name,s.student_number,nickByStudent.get(s.id),...Object.values(j?.responses||{})].map(norm).join(' ');
    return hay.includes(q);
  });
}
function render(){
  const list=rows();const done=list.filter(s=>filled(journals.get(s.id+':'+week)));
  const last=done.map(s=>journals.get(s.id+':'+week).updated_at).sort().pop();
  $('sTotal').textContent=list.length;$('sDone').textContent=done.length;$('sRate').textContent=list.length?Math.round(done.length/list.length*100)+'%':'-';$('sLast').textContent=last?fmt(last):'-';
  $('tableView').classList.toggle('hidden',view!=='table');$('cardView').classList.toggle('hidden',view!=='cards');
  if(view==='table'){
    $('tbody').innerHTML=list.map(s=>{
      const cell=w=>{const j=journals.get(s.id+':'+w);if(!filled(j))return'<td><span class="no">–</span></td>';const n=Object.values(j.responses).join('').replace(/\s/g,'').length;return'<td>'+(isStar(s.id,w)?'<span class="star">★</span> ':'')+'<span class="ok">'+n+'자</span></td>'};
      const lastAny=[10,11,12].map(w=>journals.get(s.id+':'+w)?.updated_at).filter(Boolean).sort().pop();
      const iw=v=>String(journals.get(s.id+':'+v)?.responses?.interest||'').trim();const cur=iw(week);let interest=cur?esc(cur):'';if(!cur){const pw=[12,11,10].find(v=>v!==week&&iw(v));if(pw)interest='<span class="note">'+esc(iw(pw))+' ('+pw+'주차)</span>';}
      return '<tr class="click" data-id="'+s.id+'"><td class="l"><strong>'+esc(s.full_name)+'</strong>'+pinBadge(s.id)+' <span class="note">'+esc(s.student_number)+'</span></td><td>'+esc(s.section_code||'-')+'</td><td class="l">'+esc(nickByStudent.get(s.id)||'')+'</td><td class="l">'+interest+'</td>'+cell(10)+cell(11)+cell(12)+'<td class="note">'+fmt(lastAny)+'</td></tr>';
    }).join('')||'<tr><td colspan="8" class="note">조건에 맞는 학생이 없습니다.</td></tr>';
    $('tbody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>detail(Number(tr.dataset.id)));
  } else {
    const fields=fieldsOf(week);
    $('cardView').innerHTML=done.map(s=>{const r=journals.get(s.id+':'+week).responses;
      const st=stars.get(s.id+':'+week);return '<div class="jc"><h3>'+(st?.starred?'<span class="star">★</span> ':'')+esc(s.full_name)+'</h3>'+(st?.memo?'<div class="note" style="margin-bottom:6px">메모: '+esc(st.memo)+'</div>':'')+'<div class="meta">'+esc(s.section_code||'')+'분반 · '+esc(s.student_number)+' · '+esc(nickByStudent.get(s.id)||'')+' · '+fmt(journals.get(s.id+':'+week).updated_at)+'</div>'+
        fields.filter(f=>String(r[f.key]||'').trim()).map(f=>'<div class="qa"><div class="q">'+esc(f.label)+'</div><div class="a">'+esc(r[f.key])+'</div></div>').join('')+'</div>'}).join('')||'<p class="note">선택한 주차에 작성한 학생이 없습니다.</p>';
  }
}
function sheetView(s,w,j){
  const r=j?.responses||{};
  const pv=(v,tall)=>'<div class="pval'+(tall?' tall':'')+'">'+(String(v||'').trim()?esc(v):'<span class="no">–</span>')+'</div>';
  const secs=w.sections.map(sec=>{
    let h=sec.title?'<h4 class="sh">'+esc(sec.title)+'</h4>':'';
    if(sec.layout==='info'){
      // 단계 설명 같은 참고 표는 조회 화면에 넣지 않는다
    } else if(sec.layout==='grid'){
      h+='<table class="sheet grid"><thead><tr>'+sec.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
        sec.rows.map(row=>'<tr><th class="rl">'+esc(row.label)+'</th>'+row.keys.map(k=>'<td>'+pv(r[k],true)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    } else if(sec.layout==='block'){
      h+='<table class="sheet"><tbody>'+sec.fields.map(f=>'<tr><th>'+esc(f.label)+'</th></tr><tr><td>'+pv(r[f.key],true)+'</td></tr>').join('')+'</tbody></table>';
    } else {
      h+='<table class="sheet kv"><tbody>'+sec.fields.map(f=>'<tr><th>'+esc(f.label)+'</th><td>'+pv(r[f.key],sec.tall)+'</td></tr>').join('')+'</tbody></table>';
    }
    return h;
  }).join('');
  const st=stars.get(s.id+':'+w.week);const sb='<div class="starbar"><button class="starbtn'+(st?.starred?' on':'')+'" data-sid="'+s.id+'" data-w="'+w.week+'">'+(st?.starred?'★ 별표됨':'☆ 별표')+'</button><input class="starmemo" data-sid="'+s.id+'" data-w="'+w.week+'" placeholder="메모 (교수자만 보임) · 입력 후 Enter 또는 칸 밖을 누르면 저장" value="'+esc(st?.memo||'')+'"><span class="memosaved"></span></div>';return '<div class="paper"><div class="kicker">경영정보시스템 · '+w.week+'주차</div>'+sb+'<div class="ptitle">'+esc(w.sheetTitle||'러닝 저널')+'</div>'+
    '<div class="pmeta"><span>작성자 <strong>'+esc(s.full_name)+'</strong></span><span>학번 '+esc(s.student_number)+'</span><span>'+esc(s.section_code||'')+'분반</span>'+(j?'<span style="margin-left:auto">마지막 저장 '+fmt(j.updated_at)+'</span>':'')+'</div>'+
    (filled(j)?secs:'<p class="note">아직 작성한 내용이 없습니다.</p>')+'</div>';
}
function detail(id){
  const s=roster.find(x=>x.id===id);if(!s)return;
  const weeks=WEEKS.filter(w=>w.sections.length);
  $('detail').innerHTML='<div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(s.full_name)+' <span class="note">'+esc(s.student_number)+' · '+esc(s.section_code||'-')+'분반 · 닉네임 '+esc(nickByStudent.get(id)||'미연결')+(s.major?' · '+esc(s.major):'')+'</span></h2><span class="row"><span class="note" id="pinMsg">'+esc(grantState(id)?.t||'')+'</span><button class="btn secondary" id="pinReset">PIN 재설정 허용</button><button class="btn secondary" id="closeDetail">닫기</button></span></div>'+
    (weeks.length?weeks.map(w=>sheetView(s,w,journals.get(id+':'+w.week))).join(''):'<p class="note">열린 주차가 없습니다.</p>');
  $('detail').classList.remove('hidden');$('closeDetail').onclick=()=>$('detail').classList.add('hidden');
  $('pinReset').onclick=async()=>{
    if(!nickByStudent.get(id)){$('pinMsg').textContent='닉네임이 연결되지 않은 학생입니다.';return}
    $('pinReset').disabled=true;
    const {data,error}=await db.rpc('admin_allow_pin_reset',{p_student_id:id});
    $('pinReset').disabled=false;
    await loadGrants();render();
    $('pinMsg').textContent=(error||!data||!data.ok)?'허용하지 못했습니다. 다시 로그인해 보세요.':(grantState(id)?.t||'재설정 허용됨');
  };
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function exportCsv(){
  const weeks=WEEKS.filter(w=>w.sections.length);
  const q=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['분반','이름','학번','닉네임'];
  weeks.forEach(w=>{fieldsOf(w.week).forEach(f=>head.push(w.week+'주차 · '+f.label));head.push(w.week+'주차 · 마지막 저장');head.push(w.week+'주차 · 별표');head.push(w.week+'주차 · 교수자 메모')});
  const people=roster.map(s=>({id:s.id,section:s.section_code,name:s.full_name,no:s.student_number}));
  const known=new Set(roster.map(s=>s.id));
  journals.forEach(j=>{if(!known.has(j.student_id)){known.add(j.student_id);people.push({id:j.student_id,section:j.section_code,name:(j.full_name||'')+' (명단에 없음)',no:j.student_number})}});
  const lines=[head.map(q).join(',')];
  people.forEach(p=>{
    const row=[p.section||'',p.name||'',p.no||'',nickByStudent.get(p.id)||''];
    weeks.forEach(w=>{const j=journals.get(p.id+':'+w.week);fieldsOf(w.week).forEach(f=>row.push(j?.responses?.[f.key]||''));row.push(j?fmt(j.updated_at):'');const st=stars.get(p.id+':'+w.week);row.push(st?.starred?'★':'');row.push(st?.memo||'')});
    lines.push(row.map(q).join(','));
  });
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const name='MIS_러닝저널_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.csv';
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $('status').textContent='내려받음 · '+name;
}
$('csv').onclick=exportCsv;
db.auth.onAuthStateChange(()=>setTimeout(auth,0));auth();
</script></body></html>
