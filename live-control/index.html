<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIS 2026 · Live Class Control</title>
<style>
:root{--bg:#f3f0ea;--paper:#fffdf9;--ink:#18211d;--muted:#6d736e;--line:#d9d2c7;--green:#244f43;--accent:#b44d35;--soft:#f5f2ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:880px;margin:auto;padding:0 20px}header{background:linear-gradient(135deg,#17211d,#294238);color:#fff;border-top:6px solid var(--accent);padding:34px 0}.eyebrow{font-size:.76rem;letter-spacing:.14em;color:#e5b29e;font-weight:800}h1{margin:7px 0 6px;font-size:clamp(1.9rem,5vw,2.7rem)}.sub{color:#d8dfdb}main{padding:24px 0 60px}.back{color:var(--green);font-weight:780;text-decoration:none;display:inline-block;margin-bottom:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 8px 24px rgba(29,36,32,.05);margin-bottom:14px}.card h2{margin:0 0 14px;font-size:1.25rem}.loginrow,.controls,.actions{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;font-size:16px}input,select{border:1px solid #cfc8bd;background:#fff;border-radius:10px;padding:12px 13px}input{flex:1;min-width:220px}select{min-width:130px}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#ece7df;color:#28352f}.btn.danger{background:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.status{padding:13px 15px;border-radius:11px;background:var(--soft);color:#5f6661;line-height:1.5}.status.live{background:#e6eee9;color:#244f43}.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.session{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}.session h3{margin:0 0 8px;font-size:1rem}.question{font-size:.94rem;line-height:1.55;color:#3f4944;min-height:74px}.instruction{font-size:.84rem;color:#737873;margin-top:7px}.session .actions{margin-top:14px}.note{font-size:.87rem;color:#6e746f;line-height:1.5;margin-top:10px}.hidden{display:none!important}@media(max-width:650px){.wrap{padding:0 14px}.session-grid{grid-template-columns:1fr}.card{padding:18px}.loginrow{flex-direction:column}input{width:100%}.btn{min-height:45px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">MANAGEMENT INFORMATION SYSTEMS · INSTRUCTOR</div><h1>Live Class Control</h1><div class="sub">수업 중 사용할 질문을 열고 닫습니다.</div></div></header>
<main class="wrap"><a class="back" href="../">← MIS Course Materials</a>
<section id="loginCard" class="card"><h2>교수자 로그인</h2><div class="loginrow"><input id="email" type="email" autocomplete="email" placeholder="교수자 이메일"><button id="loginBtn" class="btn">Magic Link 받기</button></div><div id="loginStatus" class="note">등록된 교수자 이메일로 로그인 링크를 받습니다.</div></section>
<section id="controlCard" class="card hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2>Week 02 · Live Class</h2><div id="userLabel" class="note"></div></div><button id="logoutBtn" class="btn secondary">로그아웃</button></div><div class="controls"><select id="section"><option value="a">A분반</option><option value="b">B분반</option><option value="c">C분반</option></select><button id="refreshBtn" class="btn secondary">상태 새로고침</button></div><div id="currentStatus" class="status" style="margin-top:14px">현재 상태를 확인하는 중입니다.</div><div id="sessionGrid" class="session-grid"></div><div class="note">새 질문을 열면 현재 열려 있는 Live Class는 먼저 닫힙니다. 학생 응답은 각 세션에 별도로 보존됩니다.</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://bwmbjfrrbeepfdfboqbg.supabase.co';const SUPABASE_KEY='sb_publishable_Ag59Uqz-yvH4AqznKHMg1g__p3sEvL0';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const WEEK='week02';
const loginCard=document.getElementById('loginCard'),controlCard=document.getElementById('controlCard'),email=document.getElementById('email'),loginBtn=document.getElementById('loginBtn'),loginStatus=document.getElementById('loginStatus'),logoutBtn=document.getElementById('logoutBtn'),section=document.getElementById('section'),grid=document.getElementById('sessionGrid'),currentStatus=document.getElementById('currentStatus'),userLabel=document.getElementById('userLabel');let sessions=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}function liveLabel(code){return /_live2$/.test(code)?'LIVE CLASS 2':'LIVE CLASS 1';}
async function setAuthUI(){const{data:{session:s}}=await db.auth.getSession();if(!s){loginCard.classList.remove('hidden');controlCard.classList.add('hidden');return;}loginCard.classList.add('hidden');controlCard.classList.remove('hidden');userLabel.textContent='로그인됨 · '+s.user.email;await loadSessions();}
loginBtn.onclick=async()=>{const e=email.value.trim();if(!e){loginStatus.textContent='이메일을 입력해 주세요.';return;}loginBtn.disabled=true;loginStatus.textContent='로그인 링크를 보내는 중입니다.';const redirectTo=location.origin+location.pathname;const{error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:redirectTo}});loginBtn.disabled=false;loginStatus.textContent=error?'로그인 링크를 보내지 못했습니다: '+error.message:'이메일을 확인해 주세요. 받은 Magic Link를 누르면 이 화면으로 돌아옵니다.';};
logoutBtn.onclick=async()=>{await db.auth.signOut();location.reload();};
document.getElementById('refreshBtn').onclick=loadSessions;section.onchange=render;
async function loadSessions(){currentStatus.className='status';currentStatus.textContent='현재 상태를 확인하는 중입니다.';const{data,error}=await db.from('live_class_sessions').select('id,session_code,week_id,section_code,question,instruction,is_open,created_at,closed_at').eq('week_id',WEEK).order('created_at',{ascending:true});if(error){currentStatus.textContent='세션을 불러오지 못했습니다: '+error.message;return;}sessions=(data||[]).filter(x=>/^week02_[abc]_live[12]$/.test(x.session_code));render();}
function render(){const sec=section.value;const visible=sessions.filter(x=>(x.section_code||'').toLowerCase()===sec&&x.session_code.startsWith('week02_'+sec+'_live')).sort((a,b)=>a.session_code.localeCompare(b.session_code));const open=sessions.find(x=>x.is_open);if(open){currentStatus.className='status live';currentStatus.innerHTML='<strong>현재 LIVE</strong> · '+esc((open.section_code||'').toUpperCase())+'분반 · '+esc(liveLabel(open.session_code));}else{currentStatus.className='status';currentStatus.textContent='현재 열려 있는 Live Class가 없습니다.';}grid.innerHTML=visible.map(s=>'<article class="session"><h3>'+esc(liveLabel(s.session_code))+(s.is_open?' · LIVE':'')+'</h3><div class="question">'+esc(s.question)+'</div>'+(s.instruction?'<div class="instruction">'+esc(s.instruction)+'</div>':'')+'<div class="actions"><button class="btn" onclick="openSession(\''+s.id+'\')" '+(s.is_open?'disabled':'')+'>열기</button><button class="btn danger" onclick="closeSession(\''+s.id+'\')" '+(!s.is_open?'disabled':'')+'>닫기</button></div></article>').join('')||'<div class="status">이 분반의 준비된 세션을 찾지 못했습니다.</div>';}
async function closeAll(){const openIds=sessions.filter(x=>x.is_open).map(x=>x.id);for(const id of openIds){const{error}=await db.from('live_class_sessions').update({is_open:false,closed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;}}
window.openSession=async id=>{if(!confirm('이 Live Class를 열까요? 현재 열린 세션이 있다면 닫힙니다.'))return;try{await closeAll();const{error}=await db.from('live_class_sessions').update({is_open:true,closed_at:null}).eq('id',id);if(error)throw error;await loadSessions();}catch(e){currentStatus.className='status';currentStatus.textContent='열지 못했습니다: '+e.message;}};
window.closeSession=async id=>{try{const{error}=await db.from('live_class_sessions').update({is_open:false,closed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadSessions();}catch(e){currentStatus.className='status';currentStatus.textContent='닫지 못했습니다: '+e.message;}};
db.auth.onAuthStateChange(()=>setTimeout(setAuthUI,0));setAuthUI();
</script>
</body></html>
