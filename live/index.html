<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIS 2026 · Live Class</title>
<style>
:root{--bg:#f3f0ea;--paper:#fffdf9;--ink:#18211d;--muted:#70756f;--line:#d9d2c7;--green:#244f43;--green-soft:#eaf1ed;--accent:#b44d35;--composer-h:96px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}header{background:linear-gradient(135deg,#17211d,#294238);color:#fff;border-top:4px solid var(--accent);padding:14px 0 12px}.eyebrow{font-size:.76rem;letter-spacing:.14em;color:#e5b29e;font-weight:800}h1{margin:3px 0 2px;font-size:clamp(1.35rem,4vw,1.8rem);line-height:1.1}.sub{display:none}
main{padding:8px 0 calc(var(--composer-h) + 10px)}.back{display:inline-block;margin:0 0 6px;font-size:.84rem;color:var(--green);text-decoration:none;font-weight:760}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(29,36,32,.06);overflow:hidden}.top{padding:10px 14px 9px;border-bottom:1px solid #ece7df}.toprow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.kicker{font-size:.76rem;letter-spacing:.11em;color:var(--accent);font-weight:850}.top h2{margin:2px 0 0;font-size:1rem}.badge{font-size:.74rem;font-weight:850;letter-spacing:.07em;padding:6px 9px;border-radius:999px;background:#eeeae3;color:#777;white-space:nowrap}.badge.on{background:#e4eee8;color:var(--green)}.question{margin-top:7px;padding:9px 11px;border-left:4px solid var(--green);border-radius:10px;background:#f5f8f6;font-size:.96rem;line-height:1.42}.instruction{margin-top:5px;color:#59635d;font-size:.82rem;line-height:1.35}.instruction:empty{display:none}
.chat{padding:18px 16px calc(var(--composer-h) + 24px);height:calc(100dvh - var(--composer-h) - 190px);min-height:420px;max-height:none;overflow-y:auto;overscroll-behavior:contain;scroll-padding-bottom:calc(var(--composer-h) + 24px);display:flex;flex-direction:column;gap:10px;background:#faf8f4}.bubble{align-self:flex-start;max-width:min(88%,640px);padding:11px 14px;border-radius:6px 16px 16px 16px;background:#fff;border:1px solid #ddd7ce;line-height:1.52;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(29,36,32,.035)}.nick{font-size:.76rem;font-weight:850;color:var(--green);margin-bottom:4px}.empty{margin:auto;text-align:center;color:#7a7f7a;line-height:1.55;padding:26px 18px}.composer{position:fixed;left:0;right:0;bottom:0;background:rgba(243,240,234,.96);backdrop-filter:blur(10px);border-top:1px solid #d8d1c6;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10}.composer-inner{max-width:820px;margin:0 auto;padding:0 20px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #cfc8bd;border-radius:12px;background:#fff;font:inherit;font-size:16px}.send{border:0;border-radius:11px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:0 18px;cursor:pointer}.send:disabled,.form input:disabled{opacity:.55;cursor:not-allowed}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:#777;font-size:.78rem}
@media(max-width:600px){.wrap,.composer-inner{padding-left:10px;padding-right:10px}header{padding:9px 0 8px}.eyebrow{font-size:.65rem}main{padding-top:5px;padding-bottom:calc(var(--composer-h) + 6px)}.back{margin-bottom:4px;font-size:.78rem}.card{border-radius:10px}.top{padding:7px 10px 6px}.toprow{align-items:center}.kicker{font-size:.67rem}.top h2{font-size:.9rem}.badge{font-size:.66rem;padding:4px 7px}.question{margin-top:5px;padding:7px 9px;font-size:.9rem;line-height:1.35}.instruction{margin-top:3px;font-size:.76rem}.chat{height:calc(100dvh - var(--composer-h) - 135px);min-height:420px;max-height:none;padding:10px 9px calc(var(--composer-h) + 14px);scroll-padding-bottom:calc(var(--composer-h) + 20px)}.bubble{max-width:93%}.send{padding:0 15px}}
.prompt-bubble{background:#e6f0e9;border:1px solid #a9c5b4;border-radius:13px;padding:13px;margin:12px 0;color:#173d2d}.prompt-bubble .nick{color:#244f43}.quote-inline{border-left:3px solid #b44d35;padding:5px 9px;margin:6px 0;background:#fff8f1;font-size:.88rem}.response-focus{border:2px solid #b44d35!important;background:#fff8ee!important}</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">MANAGEMENT INFORMATION SYSTEMS · LIVE CLASS</div><h1>Live Class</h1><div class="sub">고정 닉네임으로 수업 질문에 참여합니다.</div></div></header>
<main class="wrap"><a class="back" href="../">← MIS Course Materials</a><section class="card"><div class="top"><div class="toprow"><div><div class="kicker">WEEK 04</div><h2 id="sessionTitle">오늘의 질문</h2></div><span id="liveBadge" class="badge">STANDBY</span></div><div id="liveQuestion" class="question">현재 열려 있는 질문이 없습니다. 수업 중 질문이 열리면 자동으로 표시됩니다.</div><div id="liveInstruction" class="instruction"></div></div><div id="liveResponses" class="chat"><div class="empty">Live Class가 시작되면 응답이 여기에 표시됩니다.</div></div></section></main>
<div class="composer"><div class="composer-inner"><div class="meta" style="margin:0 0 7px"><span>닉네임: <strong id="nicknameLabel"></strong> </span></div><div class="form"><input id="liveInput" maxlength="500" placeholder="질문이 열리면 입력할 수 있습니다." disabled><button id="liveSend" class="send" type="button" disabled>보내기</button></div><div class="meta"><span id="liveStatus">교수자가 Live Class를 열기를 기다리고 있습니다.</span><span><span id="liveCount">0</span> / 500</span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://bwmbjfrrbeepfdfboqbg.supabase.co';
const SUPABASE_KEY='sb_publishable_Ag59Uqz-yvH4AqznKHMg1g__p3sEvL0';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WEEK_ID='week04';
const NICK_KEY='mis2026_site_nickname',OLD_NICK_KEY='mis2026_live_nickname';if(!localStorage.getItem(NICK_KEY)&&localStorage.getItem(OLD_NICK_KEY))localStorage.setItem(NICK_KEY,localStorage.getItem(OLD_NICK_KEY));let nickname=(localStorage.getItem(NICK_KEY)||'').trim();let currentSession=null,channel=null,checking=false,lastTimelineSignature='';
const q=document.getElementById('liveQuestion'),instruction=document.getElementById('liveInstruction'),input=document.getElementById('liveInput'),send=document.getElementById('liveSend'),badge=document.getElementById('liveBadge'),responses=document.getElementById('liveResponses'),count=document.getElementById('liveCount'),status=document.getElementById('liveStatus'),title=document.getElementById('sessionTitle'),composer=document.querySelector('.composer'),nicknameLabel=document.getElementById('nicknameLabel');
function syncComposerHeight(){document.documentElement.style.setProperty('--composer-h',composer.offsetHeight+'px');}
if('ResizeObserver'in window){new ResizeObserver(syncComposerHeight).observe(composer);}window.addEventListener('resize',syncComposerHeight);syncComposerHeight();
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function liveNo(code){return /_live2$/.test(code)?'LIVE CLASS 2':/_live1$/.test(code)?'LIVE CLASS 1':'LIVE CLASS';}
function scrollBottom(){responses.scrollTop=responses.scrollHeight;}const PIN_OK_KEY='mis2026_nickname_verified';
async function rpcNick(fn,nick,pin){const{data,error}=await db.rpc(fn,{p_nickname:nick,p_pin:pin});if(error)return{ok:false,code:'error'};return data||{ok:false,code:'error'};}
async function nickStatus(nick){const{data,error}=await db.rpc('site_nickname_status',{p_nickname:nick});if(error)return{ok:false,status:'error'};return data||{ok:false,status:'error'};}
function askFourDigitPin(message){const raw=prompt(message);if(raw===null)return{cancelled:true};const pin=raw.trim();if(!/^[0-9]{4}$/.test(pin)){alert('PIN은 숫자 4자리로 입력해 주세요.');return{invalid:true};}return{pin};}
async function secureNickname(){let saved=(localStorage.getItem(NICK_KEY)||'').trim();if(saved&&localStorage.getItem(PIN_OK_KEY)==='1')return saved;while(true){const nickRaw=prompt('MIS 사이트에서 사용할 닉네임을 입력해 주세요.',saved);if(nickRaw===null)return saved||'';const nick=nickRaw.trim().slice(0,30);if(!nick){alert('닉네임을 입력해 주세요.');continue;}const st=await nickStatus(nick);if(!st.ok){alert('닉네임 상태를 확인하지 못했습니다. 다시 시도해 주세요.');continue;}if(st.status==='registered'){const pr=askFourDigitPin('이미 PIN이 등록된 닉네임입니다.\n등록한 4자리 PIN을 입력해 주세요.');if(pr.cancelled)return saved||'';if(pr.invalid)continue;const v=await rpcNick('verify_site_nickname',nick,pr.pin);if(v.ok){localStorage.setItem(NICK_KEY,v.nickname);localStorage.setItem(PIN_OK_KEY,'1');return v.nickname;}if(v.code==='wrong_pin'){alert('PIN이 일치하지 않습니다. 다시 입력해 주세요.');continue;}alert('닉네임을 확인하지 못했습니다. 다시 시도해 주세요.');continue;}if(st.status==='legacy'){const pr=askFourDigitPin('기존에 사용하던 닉네임입니다.\n앞으로 사용할 4자리 PIN을 새로 설정해 주세요.');if(pr.cancelled)return saved||'';if(pr.invalid)continue;const v=await rpcNick('claim_legacy_site_nickname',nick,pr.pin);if(v.ok){localStorage.setItem(NICK_KEY,v.nickname);localStorage.setItem(PIN_OK_KEY,'1');return v.nickname;}if(v.code==='taken'){alert('이 닉네임에는 방금 PIN이 등록되었습니다. 등록한 PIN으로 다시 확인해 주세요.');continue;}alert('PIN을 등록하지 못했습니다. 다시 시도해 주세요.');continue;}if(st.status==='new'){const pr=askFourDigitPin('새 닉네임입니다.\n이 닉네임에 사용할 4자리 PIN을 설정해 주세요.');if(pr.cancelled)return saved||'';if(pr.invalid)continue;const v=await rpcNick('claim_site_nickname',nick,pr.pin);if(v.ok){localStorage.setItem(NICK_KEY,v.nickname);localStorage.setItem(PIN_OK_KEY,'1');return v.nickname;}if(v.code==='taken'){alert('이미 사용 중인 닉네임입니다. 다른 닉네임을 선택해 주세요.');continue;}alert('닉네임을 등록하지 못했습니다. 다시 시도해 주세요.');}}
}
async function initNickname(){nickname=await secureNickname();nicknameLabel.textContent=nickname;}initNickname();
input.addEventListener('input',()=>count.textContent=input.value.length);
async function loadResponses(){if(!currentSession)return;const sid=currentSession.id;const [rr,pp]=await Promise.all([db.from('live_class_responses').select('id,message,nickname,created_at,prompt_id').eq('session_id',sid).order('created_at',{ascending:true}).limit(300),db.from('live_class_prompts').select('id,body,quoted_response_id,created_at').eq('session_id',sid).order('created_at',{ascending:true}).limit(100)]);if(!currentSession||currentSession.id!==sid)return;if(rr.error||pp.error){responses.innerHTML='<div class="empty">대화를 불러오지 못했습니다.</div>';return;}const messages=rr.data||[],prompts=pp.data||[];const signature=messages.map(x=>'r'+x.id).join(',')+'|'+prompts.map(x=>'p'+x.id).join(',');if(signature===lastTimelineSignature)return;lastTimelineSignature=signature;const byId=new Map(messages.map(x=>[x.id,x]));const timeline=[...messages.map(x=>({...x,type:'student'})),...prompts.map(x=>({...x,type:'prof'}))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)|| (a.type==='prof'?-1:1));responses.innerHTML=timeline.length?timeline.map(x=>x.type==='prof'?'<div class="prompt-bubble"><div class="nick">교수자 · 후속 질문</div>'+(x.quoted_response_id&&byId.has(x.quoted_response_id)?'<div class="quote-inline">'+esc(byId.get(x.quoted_response_id).nickname)+': '+esc(byId.get(x.quoted_response_id).message)+'</div>':'')+esc(x.body)+'</div>':'<div class="bubble" id="response-'+x.id+'"><div class="nick">'+esc(x.nickname||'이전 익명 응답')+'</div>'+esc(x.message)+'</div>').join(''):'<div class="empty">첫 번째 응답을 남겨보세요.</div>';requestAnimationFrame(scrollBottom);}
function subscribe(){if(channel)db.removeChannel(channel);if(!currentSession)return;const sid=currentSession.id;channel=db.channel('live-'+sid).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_class_responses',filter:'session_id=eq.'+sid},()=>loadResponses()).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_class_prompts',filter:'session_id=eq.'+sid},()=>loadResponses()).subscribe();}
function standby(){lastTimelineSignature='';if(channel){db.removeChannel(channel);channel=null;}currentSession=null;badge.textContent='STANDBY';badge.className='badge';title.textContent='오늘의 질문';q.textContent='현재 열려 있는 질문이 없습니다. 수업 중 질문이 열리면 자동으로 표시됩니다.';instruction.textContent='';input.value='';count.textContent='0';input.disabled=true;send.disabled=true;input.placeholder='질문이 열리면 입력할 수 있습니다.';status.textContent='교수자가 Live Class를 열기를 기다리고 있습니다.';responses.innerHTML='<div class="empty">Live Class가 시작되면 응답이 여기에 표시됩니다.</div>';}
async function findOpenSession(){if(checking)return;checking=true;const{data,error}=await db.from('live_class_sessions').select('id,session_code,section_code,question,instruction,is_open').eq('week_id',WEEK_ID).eq('is_open',true).order('created_at',{ascending:false}).limit(1).maybeSingle();checking=false;if(error||!data){if(currentSession)standby();return;}const changed=!currentSession||currentSession.id!==data.id;currentSession=data;badge.textContent='LIVE';badge.className='badge on';title.textContent=liveNo(data.session_code);q.innerHTML='<strong>'+esc(data.question)+'</strong>';instruction.textContent=data.instruction||'';input.disabled=false;send.disabled=false;input.placeholder='짧게 입력해보세요.';status.textContent=nickname+' 닉네임으로 참여합니다.';if(changed){lastTimelineSignature='';input.value='';count.textContent='0';responses.innerHTML='<div class="empty">응답을 불러오는 중입니다.</div>';await loadResponses();subscribe();}}
send.addEventListener('click',async()=>{const text=input.value.trim();if(!currentSession||!text)return;send.disabled=true;status.textContent='등록 중...';const sid=currentSession.id;const{error}=await db.from('live_class_responses').insert({session_id:sid,message:text,nickname:nickname});if(!currentSession||currentSession.id!==sid)return;send.disabled=false;if(error){status.textContent='등록하지 못했습니다. 질문이 아직 열려 있는지 확인해 주세요.';await findOpenSession();return;}input.value='';count.textContent='0';status.textContent='등록되었습니다.';await loadResponses();setTimeout(()=>{if(currentSession)status.textContent=nickname+' 닉네임으로 참여합니다.';},1800);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send.click();}});
standby();findOpenSession();setInterval(findOpenSession,5000);setInterval(()=>{if(currentSession&&!document.hidden)loadResponses();},2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentSession)loadResponses();});
</script>
</body>
</html>
