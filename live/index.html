<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIS 2026 · Live Class</title>
<style>
:root{--bg:#f3f0ea;--paper:#fffdf9;--ink:#18211d;--muted:#70756f;--line:#d9d2c7;--green:#244f43;--green-soft:#eaf1ed;--accent:#b44d35;--composer-h:96px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}header{background:linear-gradient(135deg,#17211d,#294238);color:#fff;border-top:6px solid var(--accent);padding:34px 0 30px}.eyebrow{font-size:.76rem;letter-spacing:.14em;color:#e5b29e;font-weight:800}h1{margin:7px 0 7px;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.1}.sub{color:#d8dfdb;font-size:.95rem}
main{padding:22px 0 calc(var(--composer-h) + 28px)}.back{display:inline-block;margin:0 0 16px;color:var(--green);text-decoration:none;font-weight:760}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(29,36,32,.06);overflow:hidden}.top{padding:22px 22px 18px;border-bottom:1px solid #ece7df}.toprow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.kicker{font-size:.76rem;letter-spacing:.11em;color:var(--accent);font-weight:850}.top h2{margin:6px 0 2px;font-size:1.42rem}.badge{font-size:.74rem;font-weight:850;letter-spacing:.07em;padding:6px 9px;border-radius:999px;background:#eeeae3;color:#777;white-space:nowrap}.badge.on{background:#e4eee8;color:var(--green)}.question{margin-top:16px;padding:16px 17px;border-left:4px solid var(--green);border-radius:10px;background:#f5f8f6;font-size:1.06rem;line-height:1.62}.instruction{margin-top:10px;color:#59635d;font-size:.91rem;line-height:1.5}.instruction:empty{display:none}
.chat{padding:18px 16px calc(var(--composer-h) + 24px);min-height:220px;max-height:min(46vh,calc(100dvh - 430px));overflow-y:auto;overscroll-behavior:contain;scroll-padding-bottom:calc(var(--composer-h) + 24px);display:flex;flex-direction:column;gap:10px;background:#faf8f4}.bubble{align-self:flex-start;max-width:min(88%,640px);padding:11px 14px;border-radius:6px 16px 16px 16px;background:#fff;border:1px solid #ddd7ce;line-height:1.52;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(29,36,32,.035)}.empty{margin:auto;text-align:center;color:#7a7f7a;line-height:1.55;padding:26px 18px}.composer{position:fixed;left:0;right:0;bottom:0;background:rgba(243,240,234,.96);backdrop-filter:blur(10px);border-top:1px solid #d8d1c6;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10}.composer-inner{max-width:820px;margin:0 auto;padding:0 20px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #cfc8bd;border-radius:12px;background:#fff;font:inherit;font-size:16px}.send{border:0;border-radius:11px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:0 18px;cursor:pointer}.send:disabled,.form input:disabled{opacity:.55;cursor:not-allowed}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:#777;font-size:.78rem}
@media(max-width:600px){.wrap,.composer-inner{padding-left:14px;padding-right:14px}header{padding:28px 0 25px}main{padding-top:16px;padding-bottom:calc(var(--composer-h) + 24px)}.card{border-radius:15px}.top{padding:18px 17px 15px}.chat{height:40vh;min-height:320px;max-height:440px;padding:15px 12px calc(var(--composer-h) + 20px);scroll-padding-bottom:calc(var(--composer-h) + 20px)}.bubble{max-width:93%}.send{padding:0 15px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">MANAGEMENT INFORMATION SYSTEMS · LIVE CLASS</div><h1>Live Class</h1><div class="sub">교수자가 연 질문에 익명으로 짧게 참여합니다.</div></div></header>
<main class="wrap"><a class="back" href="../">← MIS Course Materials</a><section class="card"><div class="top"><div class="toprow"><div><div class="kicker">WEEK 03</div><h2 id="sessionTitle">오늘의 질문</h2></div><span id="liveBadge" class="badge">STANDBY</span></div><div id="liveQuestion" class="question">현재 열려 있는 질문이 없습니다. 수업 중 질문이 열리면 자동으로 표시됩니다.</div><div id="liveInstruction" class="instruction"></div></div><div id="liveResponses" class="chat"><div class="empty">Live Class가 시작되면 응답이 여기에 표시됩니다.</div></div></section></main>
<div class="composer"><div class="composer-inner"><div class="form"><input id="liveInput" maxlength="200" placeholder="질문이 열리면 입력할 수 있습니다." disabled><button id="liveSend" class="send" type="button" disabled>보내기</button></div><div class="meta"><span id="liveStatus">교수자가 Live Class를 열기를 기다리고 있습니다.</span><span><span id="liveCount">0</span> / 200</span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://bwmbjfrrbeepfdfboqbg.supabase.co';
const SUPABASE_KEY='sb_publishable_Ag59Uqz-yvH4AqznKHMg1g__p3sEvL0';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WEEK_ID='week03';
let currentSession=null,channel=null,checking=false;
const q=document.getElementById('liveQuestion'),instruction=document.getElementById('liveInstruction'),input=document.getElementById('liveInput'),send=document.getElementById('liveSend'),badge=document.getElementById('liveBadge'),responses=document.getElementById('liveResponses'),count=document.getElementById('liveCount'),status=document.getElementById('liveStatus'),title=document.getElementById('sessionTitle'),composer=document.querySelector('.composer');
function syncComposerHeight(){document.documentElement.style.setProperty('--composer-h',composer.offsetHeight+'px');}
if('ResizeObserver'in window){new ResizeObserver(syncComposerHeight).observe(composer);}window.addEventListener('resize',syncComposerHeight);syncComposerHeight();
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function liveNo(code){return /_live2$/.test(code)?'LIVE CLASS 2':/_live1$/.test(code)?'LIVE CLASS 1':'LIVE CLASS';}
function scrollBottom(){responses.scrollTop=responses.scrollHeight;}
input.addEventListener('input',()=>count.textContent=input.value.length);
async function loadResponses(){if(!currentSession)return;const sid=currentSession.id;const{data,error}=await db.from('live_class_responses').select('id,message,created_at').eq('session_id',sid).order('created_at',{ascending:true}).limit(150);if(!currentSession||currentSession.id!==sid)return;if(error){responses.innerHTML='<div class="empty">응답을 불러오지 못했습니다.</div>';return;}responses.innerHTML=data?.length?data.map(x=>'<div class="bubble">'+esc(x.message)+'</div>').join(''):'<div class="empty">첫 번째 익명 응답을 남겨보세요.</div>';requestAnimationFrame(scrollBottom);}
function subscribe(){if(channel)db.removeChannel(channel);if(!currentSession)return;const sid=currentSession.id;channel=db.channel('live-'+sid).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_class_responses',filter:'session_id=eq.'+sid},()=>loadResponses()).subscribe();}
function standby(){if(channel){db.removeChannel(channel);channel=null;}currentSession=null;badge.textContent='STANDBY';badge.className='badge';title.textContent='오늘의 질문';q.textContent='현재 열려 있는 질문이 없습니다. 수업 중 질문이 열리면 자동으로 표시됩니다.';instruction.textContent='';input.value='';count.textContent='0';input.disabled=true;send.disabled=true;input.placeholder='질문이 열리면 입력할 수 있습니다.';status.textContent='교수자가 Live Class를 열기를 기다리고 있습니다.';responses.innerHTML='<div class="empty">Live Class가 시작되면 응답이 여기에 표시됩니다.</div>';}
async function findOpenSession(){if(checking)return;checking=true;const{data,error}=await db.from('live_class_sessions').select('id,session_code,section_code,question,instruction,is_open').eq('week_id',WEEK_ID).eq('is_open',true).order('created_at',{ascending:false}).limit(1).maybeSingle();checking=false;if(error||!data){if(currentSession)standby();return;}const changed=!currentSession||currentSession.id!==data.id;currentSession=data;badge.textContent='LIVE';badge.className='badge on';title.textContent=liveNo(data.session_code);q.innerHTML='<strong>'+esc(data.question)+'</strong>';instruction.textContent=data.instruction||'';input.disabled=false;send.disabled=false;input.placeholder='짧게 입력해보세요.';status.textContent='익명으로 참여합니다.';if(changed){input.value='';count.textContent='0';responses.innerHTML='<div class="empty">응답을 불러오는 중입니다.</div>';await loadResponses();subscribe();}}
send.addEventListener('click',async()=>{const text=input.value.trim();if(!currentSession||!text)return;send.disabled=true;status.textContent='등록 중...';const sid=currentSession.id;const{error}=await db.from('live_class_responses').insert({session_id:sid,message:text});if(!currentSession||currentSession.id!==sid)return;send.disabled=false;if(error){status.textContent='등록하지 못했습니다. 질문이 아직 열려 있는지 확인해 주세요.';await findOpenSession();return;}input.value='';count.textContent='0';status.textContent='등록되었습니다.';await loadResponses();setTimeout(()=>{if(currentSession)status.textContent='익명으로 참여합니다.';},1800);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send.click();}});
standby();findOpenSession();setInterval(findOpenSession,5000);
</script>
</body>
</html>
